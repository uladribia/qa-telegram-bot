# Frozen generation dataset: the generator, isolated from retrieval.
#
# Each case supplies exactly the evidence the model will see, so a failure
# belongs to the generator's decision (answer vs abstain, and what it cites)
# and not to the index. The evidence is the corpus's own subject matter
# (a football club's supporters, equipment, and membership), written so the
# expected answer is unambiguous from the text alone.
#
# Rules this dataset keeps:
#   - no LLM judge; expected facts are strings a human checked;
#   - parser/provider failures are not cases here, they are unit tests;
#   - every expected source id must appear in that case's own evidence.
- id: single_sufficient_source
  question: "Quan s'obren les oficines de recepció?"
  evidence:
    - source_id: "qa-horari-oficines"
      label: "Q&A"
      authority: 90
      text: "Les oficines de recepció s'open de dilluns a divendres de 9:00 a 14:00 i de 17:00 a 20:00. Els dissabtes romanen tancades."
  expected:
    mode: synthesis
    source_ids: ["qa-horari-oficines"]
    must_include: ["9:00", "14:00"]
    # "dissabtes" was here first and was a mistake: the evidence itself says
    # Saturday is closed, so a faithful answer mentions it and trips the check.
    # A forbidden phrase must be something the evidence does not support.
    must_not_claim: ["24 hores", "obertes tots els dies"]

- id: only_one_of_many_answers
  question: "On es fa la prova d'equip?"
  evidence:
    - source_id: "msg-xarramenta"
      label: "Missatge del grup"
      kind: message
      authority: 40
      text: "Avui hem parlat de la premsa i del sopar de Nadal."
    - source_id: "qa-prova-equip"
      label: "Q&A"
      authority: 90
      text: "La prova d'equip es fa al camp de l'Hospitalet, dissabte a les 10:00."
    - source_id: "msg-camp"
      label: "Missatge del grup"
      kind: message
      authority: 40
      text: "El camp nou és gran i hi ha vestidors nous."
  expected:
    mode: synthesis
    source_ids: ["qa-prova-equip"]
    must_include: ["Hospitalet", "10:00"]
    must_not_claim: ["Nadal", "vestidors"]

