- id: explicit-1
  category: explicit_genuine
  text: 'Els Ball-Kids són nens i nenes que ajuden durant els partits dels equips grans (per exemple,
    recollint la pilota que surt del camp). És una manera divertida perquè els més petits visquin l''ambient
    dels partits de primer nivell i s''il·lusionin amb el hoquei.

    Quan una secció necessita Ball-Kids per a un partit concret, s''envia un avís pel grup de WhatsApp
    corresponent amb el dia, l''hora i el nombre de places disponibles. Cal portar l''uniforme d''entrenament
    i espinilleres, i arribar mitja hora abans de l''inici del partit. Sol haver-hi un petit sorteig d''un
