  text: 'Les inscripcions i renovacions es fan en línia a través de la plataforma Cluber:

    - Accedeix a l''enllaç d''inscripció que envia el club a l''inici de cada temporada (o entra directament
    a app.cluber.es).

    - Inicia sessió amb el número de mòbil del jugador/a.

    - Crea o introdueix la teva contrasenya.

    - Omple el formulari per validar les dades personals.

    - Confirma la quota corresponent a la teva secció.

    - Valida el mètode de pagament.


    També ho pots fer des de l''app de Cluber, disponible a Google Play i a l''App Store. Normalment el
    primer pagament no es fa efectiu fins al setembre, així que és recomanable fer la renovació com més
    aviat millor.

    Si tens qualsevol dubte durant el procés, pots escriure a soporte@cluber.com.'
