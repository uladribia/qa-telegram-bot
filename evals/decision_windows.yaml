    pel grup de WhatsApp corresponent.

    - Aglomeració sense restricció formal: si hi ha un concert o un altre esdeveniment a la zona de Montjuïc
    però no hi ha cap restricció d''accés, sol haver-hi més gentada i trànsit, sobretot a l''hora de la
