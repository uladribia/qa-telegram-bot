id: clef-decision-windows
description: Hard listener decision windows built from the canonical Q&A anchors. Reviewed once and frozen
  before any model output exists; never edit these after seeing results. Regenerate only with scripts/build_decision_windows.py
  when the underlying Q&A changes.
schema_version: qa-bot-decision-windows-v1
seed: 20261003
anchor_count: 40
review:
  status: reviewed and frozen before any model output existed
  findings_fixed:
  - no_correct windows whose hard negative was answered by the text
  - multi_one_correct windows whose negative duplicated the positive
  - explicit_genuine windows whose sibling question was also answered
  - ambiguous windows built from a truncated answer, which still answered its own question and so were
    not ambiguous at all
  audited_by: scripts/build_decision_windows.py overlap rules, plus a manual read of every window
  deviations:
  - ambiguous windows use generic short answers rather than a truncated corpus answer, because a truncated
    corpus answer still answers its own question
  - anchors may repeat across categories; only a window's own content must be unique
  known_softness:
  - 'three explicit_unrelated windows assert no intent label: a non-answer such as ''ho miro després''
    is genuinely arguable, and those labels are informational only'
