- case_id: canonical-qa-entrenaments-pluja
  family: gold
  question: Si plou, s'entrena igualment?
  evidence:
  - evidence_id: qa-concerts-esdeveniments-acces
    text: 'Cal distingir dues situacions diferents: - Prohibició o restricció real d''accés: quan l''Institut
      Barcelona Esports (IBE) o l''Ajuntament informen el club d''una restricció efectiva, el club ho
      comunica a través del delegat/da de cada secció pel grup de WhatsApp corresponent. - Aglomeració
      sense restricció formal: si hi ha un concert o un altre esdeveniment a la zona de Montjuïc però
      no hi ha cap restricció d''accés, sol haver-hi més gentada i trànsit, sobretot a l''hora de la recollida.
      En aquests casos no cal cap avís especial del club, però et recomanem pujar amb una mica més de
      temps de marge.'
  - evidence_id: qa-entrenaments-pluja
    text: Per norma general, si plou es manté l'entrenament. Si en algun moment les condicions fossin
      impracticables, el club avisaria com més aviat millor; mentre no rebeu cap comunicació en sentit
      contrari, doneu per fet que l'entrenament es manté. Si un cop a la instal·lació es posa a ploure
      durant la sessió, els entrenadors tenen recursos per fer activitats a cobert (jocs, xerrades, pissarra,
      etc.). És recomanable que els nens i nenes portin un impermeable, i roba de recanvi per canviar-se
      en acabar l'entrenament.
  - evidence_id: qa-instalacions-pau-negre
    text: 'Tots els equips entrenen al Complex Esportiu Municipal Pau Negre, al Parc del Migdia de Montjuïc:
      Passeig Olímpic, 6, Sants-Montjuïc, 08038 Barcelona Pel que fa als partits: es juguen al Pau Negre
      quan l''equip fa de local, i al camp de l''equip rival quan fa de visitant. (A Minis, en general,
      no hi ha partits de competició pròpiament dits.) Per aparcar, el camp de criquet disposa d''una
      explanada al costat, i a la instal·lació hi ha lavabos i dutxes.'
  expected_answer_ids:
  - qa-entrenaments-pluja
  expected_sufficient: true
  reason: canonical_anchor
  split: test
- case_id: canonical-qa-taula-categories-edats
  family: gold
  question: Quines edats corresponen a cada categoria?
  evidence:
  - evidence_id: qa-hockey-sala-herba-combinat
    text: 'Sí, en algunes categories (a partir d''Aleví, aproximadament) hi pot haver una part de la temporada
      en què l''equip alterna hoquei sala i hoquei herba. Un esquema habitual és dividir el grup en dos:
      mentre un subgrup entrena hoquei sala en una instal·lació coberta, l''altre entrena hoquei herba
      al Pau Negre, i al cap d''uns dies s''intercanvien. Sovint hi ha algun dia de la setmana en què
      tot l''equip entrena junt en hoquei sala. El calendari exacte, els horaris i la instal·lació concreta
      els confirma l''entrenador/a de cada equip a l''inici de curs, així que consulta-ho amb l''entrenador/a
      o el delega'
  - evidence_id: qa-taula-categories-edats
    text: CategoriaCurs escolar MinisI3, I4 i I5 Prebenjamí1r i 2n de primària Benjamí3r i 4t de primària
      Aleví5è i 6è de primària Infantil1r i 2n d'ESO Cadet3r i 4t d'ESO Juvenil1r i 2n de Batxillerat
      Séniorun cop acabat el Batxillerat Papis i Mamis+35 anys Veterans/es+40 anys Fem servir el curs
      escolar en lloc de l'any de naixement perquè la taula no quedi desactualitzada d'un curs a l'altre.
  - evidence_id: qa-organitzacio-escola
    text: 'L''escola s''organitza per categories d''edat, de més petits a més grans: - Escoleta (dissabtes)
      - Minis - Prebenjamí - Benjamí - Aleví - Infantil - Cadet - Juvenil A Benjamí ja es pot fer equip
      masculí i equip femení separats si hi ha prou jugadors i jugadores; a partir d''Aleví, els grups
      ja se solen dividir sempre en equips masculins i femenins. En algunes categories, a més, hi conviuen
      equips diferenciats del Barcelona Hockey Club (BHC) i del FC Barcelona (FCB). Cada equip té el seu
      propi delegat/da i cos tècnic.'
  - evidence_id: qa-bhc-vs-fcb
    text: 'La secció d''hoquei conviu sota una mateixa Junta i Direcció Tècnica, però cada categoria pertany
      a un dels dos clubs: ClubCategories FC Barcelona (FCB)Benjamí, Aleví, Infantil A, Cadet A, Juvenil
      A, Divisió d''Honor (masculí i femení), Filial (masculí i femení) Barcelona Hockey Club (BHC)Minis,
      Prebenjamí, Infantil B, 2a Divisió, 3a Divisió, Mamis i Papis, Hockey+, i Hockey Sala (totes les
      categories) Els tècnics, preparadors físics, fisios i metges donen servei a totes dues branques
      per igual. A Minis, per tant, el club de referència és el BHC. Aquesta distribució pot variar d''una
      temporada a '
  - evidence_id: qa-valors-club
    text: 'El club (secció de Hockey FCB-BHC) es defineix a través de cinc valors: Humilitat, Esforç,
      Ambició, Respecte i Treball en equip. Més enllà del resultat esportiu, l''objectiu declarat de l''escola
      és formar jugadors i jugadores íntegres i persones amb valors.'
