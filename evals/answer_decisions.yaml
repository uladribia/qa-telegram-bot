- case_id: canonical-qa-mini-competicions
  family: gold
  question: Els minis juguen a les competicions?
  evidence:
  - evidence_id: qa-mini-un-cop-setmana
    text: Els minis poden venir a entrenar un cop per setmana sense cap problema. Tot i així, venir a
      tots els entrenaments ajuda al fet que els companys i companyes no es quedin amb grups molt reduïts
      o hagin d'entrenar amb altres seccions, i per tant contribueix al fet que tothom tingui la millor
      experiència esportiva.
  - evidence_id: qa-mini-competicions
    text: Els Minis no tenen una competició pròpia. Tot i així, puntualment, l'entrenador/a pot convocar
      algun jugador/a de Minis per completar l'equip de Prebenjamí en algun partit. Aquesta decisió es
      pren conjuntament entre l'entrenador/a i la família, valorant si el nen o la nena pot i vol competir.
  - evidence_id: qa-mini-fitxa-federativa
    text: 'La llicència federativa és obligatòria per a tots els jugadors i jugadores, també a Minis:
      no és només un tema esportiu, és una qüestió de seguretat, ja que inclou l''assegurança mèdica.
      El club no es pot arriscar a tenir infants entrenant sense aquesta cobertura, per petits que siguin.
      Per a les famílies noves, el club sol donar un període de prova abans de formalitzar l''inscripció,
      per veure si l''infant vol continuar.'
  expected_answer_ids:
  - qa-mini-competicions
  expected_sufficient: true
  reason: canonical_anchor
  split: test
