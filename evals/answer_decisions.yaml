- case_id: canonical-qa-preus-comanda-roba-thunder
  family: gold
  question: Quant costa l'equipament del BHC i on es demana?
  evidence:
  - evidence_id: qa-talles-equipament
    text: Pots consultar la guia de talles oficial a la botiga (Store) del FC Barcelona, on trobaràs les
      mides de cada peça de l'equipament abans de fer la comanda.
  - evidence_id: qa-preus-comanda-roba-thunder
    text: 'Preus orientatius (poden variar d''una temporada a una altra; confirma sempre el preu vigent):
      - Samarreta: 38,50€ - Pantaló curt / faldilla: 29,50€ - Mitges: 18,50€ - Dessuadora amb caputxa
      (Junior): 34,90€ - Pack equipació complet Adult: 125€ - Pack equipació complet Junior: 86,50€ -
      Impermeable: 27,90€ - Softshell: 59,90€ Les comandes es fan per correu a ropabhc1977@gmail.com.'
  - evidence_id: qa-com-sescull-dorsal
    text: El dorsal s'escull dins de la gamma del 2 al 30, i no es pot triar un número que ja estigui
      assignat a un altre jugador/a de la categoria. Quan dos o més jugadors/es volen el mateix dorsal,
      es dóna prioritat a qui ja el portava la temporada anterior. Si encara hi ha empat, es fa un sorteig.
      El nom de l'esquena sempre és el nom del nen/a. La llista de números disponibles per a la teva categoria
      la dona el delegat/da de la secció.
  - evidence_id: qa-guia-talles-roba-thunder
    text: Aquestes són les taules de mides (en cm) de l'equipament del Barcelona Hockey Club (BHC), del
      proveïdor Thunder. (No confondre amb l'equipament oficial del FC Barcelona, que té la seva pròpia
      guia de talles a la botiga del Barça.) Samarreta nena (Jr.) Talla46810121416 Ample27,529,53234,53739,541,5
      Llarg36,5404447,551,55559 Màniga7,58,59,510111212,5 Faldilla nena Talla4681012 Cintura27,528,529,530,531,5
      Llarg2728293033 Samarreta nen (Jr.) Talla2468101214 Ample28313437404346 Llarg43475155596367 Màniga18192021222324
      Pantaló curt nen (Jr.) Talla6810121416 Cintura282930313233 Maluc454749515355 Llar
  - evidence_id: qa-faldilla-equipament
    text: En hoquei femení és habitual que les jugadores portin faldilla en lloc del pantaló de l'equipament.
      Nike no proporciona faldilles (no en té per a cap altre esport), així que el club ha contactat amb
      un altre proveïdor (Thunder Hockey) per fer la comanda de les faldilles que calguin.
  - evidence_id: qa-equipament-com-demanar
    text: El club avisa a l'inici de cada temporada, normalment durant els primers dies d'entrenament,
      de quan i com es pot demanar l'equipament. Habitualment, primer es deixa que els nens i nenes es
      provin les talles a l'entrenament amb l'equipament de mostra; un cop fet això, es pot sol·licitar
      la talla (i el dorsal, en funció de la disponibilitat). El delegat/da envia llavors una llista perquè
      cada família hi apunti la seva comanda. Un cop feta la comanda, l'equipament es recull a la caseta
      de material, a la planta 0, després de passar el camp 1. Els horaris de recollida els comunica el
      delegat/da de
  - evidence_id: qa-arribada-equipaments
    text: Encara no tenim aquesta informació confirmada. En quant la tinguem, l'afegirem aquí. Mentrestant,
      pots consultar-ho amb el delegat/da de la teva secció.
  expected_answer_ids:
  - qa-preus-comanda-roba-thunder
  expected_sufficient: true
  reason: canonical_anchor
  split: test
- case_id: canonical-qa-metode-pagament-cluber
  family: gold
  question: Com es paguen la quota i la llicència federativa?
  evidence:
  - evidence_id: qa-que-inclou-pagament
    text: El pagament inclou la quota del club i la llicència federativa anual (amb l'assegurança mèdica
      corresponent). L'equipament (samarreta, pantalons i mitgetes) es paga a part. Els pagaments es fan
      a través de la plataforma Cluber, no en efectiu. Quan tanques la inscripció o la renovació a Cluber
      (app.cluber.es, o l'aplicació mòbil de Cluber) se't demana validar el mètode de pagament i confirmar
      la quota corresponent a la teva secció. La quota del club i la llicència federativa s'abonen en
      el mateix procés. Per a qualsevol dubte sobre el pagament, soporte@cluber.com.
  - evidence_id: qa-metode-pagament-cluber
    text: Els pagaments del club es fan a través de la plataforma Cluber, no en efectiu ni amb cap altre
      mètode. Al tancar la inscripció o la renovació a Cluber (app.cluber.es, o l'aplicació mòbil de Cluber)
      se't demana validar el mètode de pagament i confirmar la quota corresponent a la secció. La quota
      del club i la llicència federativa anual s'abonen en el mateix procés; l'equipament (samarreta,
      pantalons i mitgetes) es paga a part. Si el pagament no és efectiu fins al setembre, el club recomana
      fer la renovació com més aviat millor. Per a qualsevol dubte sobre el pagament, soporte@cluber.com.
  - evidence_id: qa-proces-inscripcions
    text: 'El procés varia una mica segons si es tracta d''una renovació o d''una alta nova: - Renovacions:
      es fan directament a través de Cluber seguint els passos explicats a la pregunta "Què he de fer
      per inscriure o renovar un jugador?". - Altes noves: normalment cal que el/la responsable de la
      secció doni el vistiplau al nou jugador/a (per exemple després d''un període de prova) abans de
      formalitzar l''inscripció. En el cas de menors d''edat, durant el procés els tutors legals han de
      signar electrònicament la documentació i la normativa del club; rebreu un correu de signatura per
      a cada tutor indicat al '
  - evidence_id: qa-inscripcio-renovacio
    text: 'Les inscripcions i renovacions es fan en línia a través de la plataforma Cluber: - Accedeix
      a l''enllaç d''inscripció que envia el club a l''inici de cada temporada (o entra directament a
      app.cluber.es). - Inicia sessió amb el número de mòbil del jugador/a. - Crea o introdueix la teva
      contrasenya. - Omple el formulari per validar les dades personals. - Confirma la quota corresponent
      a la teva secció. - Valida el mètode de pagament. També ho pots fer des de l''app de Cluber, disponible
      a Google Play i a l''App Store. Normalment el primer pagament no es fa efectiu fins al setembre,
      així que és recoma'
  expected_answer_ids:
  - qa-metode-pagament-cluber
  expected_sufficient: true
  reason: canonical_anchor
  split: test
- case_id: canonical-qa-casal-estiu-bhc
  family: gold
  question: El club organitza algun casal d'estiu?
  evidence:
  - evidence_id: qa-ball-kids
    text: Els Ball-Kids són nens i nenes que ajuden durant els partits dels equips grans (per exemple,
      recollint la pilota que surt del camp). És una manera divertida perquè els més petits visquin l'ambient
      dels partits de primer nivell i s'il·lusionin amb el hoquei. Quan una secció necessita Ball-Kids
      per a un partit concret, s'envia un avís pel grup de WhatsApp corresponent amb el dia, l'hora i
      el nombre de places disponibles. Cal portar l'uniforme d'entrenament i espinilleres, i arribar mitja
      hora abans de l'inici del partit. Sol haver-hi un petit sorteig d'un regal a final de temporada
      entre tots el
  - evidence_id: qa-casal-estiu-bhc
    text: Sí, el BHC organitza cada estiu un Casal d'Estiu obert a nens i joves, que combina hoquei amb
      altres activitats lúdiques. La informació concreta de dates, horaris i inscripció es publica cada
      temporada al web del club i es comunica per les vies habituals (WhatsApp, delegat/da).
