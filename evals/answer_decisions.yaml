  question: important certificat medic
  evidence:
  - evidence_id: qa-caducitat-certificat-medic
    text: 'Ho pots consultar des de l''app de la Federació: - Entra a l''app. - Accedeix a "Esportista".
      - Introdueix el DNI i la data de naixement. - Un cop iniciada la sessió, vés a configuració (a baix
      a la dreta, "Més"). - Prem a "El meu compte". - Mira la data de caducitat.'
  - evidence_id: qa-certificat-medic
    text: El certificat mèdic esportiu és obligatori i ha d'estar en vigor. Sense un certificat mèdic
      al dia, el club no pot tramitar la fitxa del jugador/a, la qual cosa vol dir que no podrà entrenar
      ni jugar partits fins que es regularitzi la situació.
  - evidence_id: qa-anamnesi-format
    text: No, cal portar-la impresa. L'anamnesi s'ha de portar en paper el dia de la revisió mèdica (que
      fa una empresa externa), no serveix enviar-la per email ni en format digital.
  - evidence_id: qa-revisio-medica-reserva
    text: No cal que ho gestionis tu directament ni que reservis hora enlloc. Quan es confirmen les dates
      de les revisions mèdiques a l'inici de curs, el delegat/da de la teva secció n'informa i recull
      els noms de qui les necessita per apuntar-vos a la llista.
  - evidence_id: qa-app-federacio-descarrega
    text: 'La pots descarregar directament des dels enllaços oficials: - App Store (iOS) - Google Play
      (Android) Serveix, per exemple, per consultar la data de caducitat del certificat mèdic del jugador/a,
      i el club la pot demanar puntualment per a altres gestions.'
  - evidence_id: qa-revisio-medica-cost
    text: Sí. Habitualment costa una vintena d'euros, i el certificat resultant és vàlid per a dues temporades.
      Confirma el preu vigent amb el club, ja que pot variar d'un curs a un altre.
  - evidence_id: qa-acompanyament-revisio-medica
    text: Sí, per l'edat dels petits els pares/mares haurien d'acompanyar-los a la revisió mèdica.
  expected_answer_ids:
  - qa-certificat-medic
  expected_sufficient: true
  reason: known_answer_paraphrase
  split: calibration
