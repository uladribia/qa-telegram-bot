- case_id: canonical-qa-com-sescull-dorsal
  family: gold
  question: Com s'escull el dorsal de la samarreta?
  evidence:
  - evidence_id: qa-faldilla-equipament
    text: En hoquei femení és habitual que les jugadores portin faldilla en lloc del pantaló de l'equipament.
      Nike no proporciona faldilles (no en té per a cap altre esport), així que el club ha contactat amb
      un altre proveïdor (Thunder Hockey) per fer la comanda de les faldilles que calguin.
  - evidence_id: qa-com-sescull-dorsal
    text: El dorsal s'escull dins de la gamma del 2 al 30, i no es pot triar un número que ja estigui
      assignat a un altre jugador/a de la categoria. Quan dos o més jugadors/es volen el mateix dorsal,
      es dóna prioritat a qui ja el portava la temporada anterior. Si encara hi ha empat, es fa un sorteig.
      El nom de l'esquena sempre és el nom del nen/a. La llista de números disponibles per a la teva categoria
      la dona el delegat/da de la secció.
  - evidence_id: qa-talles-equipament
    text: Pots consultar la guia de talles oficial a la botiga (Store) del FC Barcelona, on trobaràs les
      mides de cada peça de l'equipament abans de fer la comanda.
  - evidence_id: qa-preus-comanda-roba-thunder
    text: 'Preus orientatius (poden variar d''una temporada a una altra; confirma sempre el preu vigent):
      - Samarreta: 38,50€ - Pantaló curt / faldilla: 29,50€ - Mitges: 18,50€ - Dessuadora amb caputxa
      (Junior): 34,90€ - Pack equipació complet Adult: 125€ - Pack equipació complet Junior: 86,50€ -
      Impermeable: 27,90€ - Softshell: 59,90€ Les comandes es fan per correu a ropabhc1977@gmail.com.'
  - evidence_id: qa-arribada-equipaments
    text: Encara no tenim aquesta informació confirmada. En quant la tinguem, l'afegirem aquí. Mentrestant,
      pots consultar-ho amb el delegat/da de la teva secció.
  - evidence_id: qa-equipament-com-demanar
