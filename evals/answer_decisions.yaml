- case_id: gold_abstention_01
  family: gold
  question: Quin és el dorsal del meu fill?
  evidence:
  - evidence_id: qa-concerts-esdeveniments-acces
    text: 'Cal distingir dues situacions diferents: - Prohibició o restricció real d''accés: quan l''Institut
      Barcelona Esports (IBE) o l''Ajuntament informen el club d''una restricció efectiva, el club ho
      comunica a través del delegat/da de cada secció pel grup de WhatsApp corresponent. - Aglomeració
      sense restricció formal: si hi ha un concert o un altre esdeveniment a la zona de Montjuïc però
      no hi ha cap restricció d''accés, sol haver-hi més gentada i trànsit, sobretot a l''hora de la recollida.
      En aquests casos no cal cap avís especial del club, però et recomanem pujar amb una mica més de
      temps de marge.'
  - evidence_id: qa-equipament-com-demanar
    text: El club avisa a l'inici de cada temporada, normalment durant els primers dies d'entrenament,
      de quan i com es pot demanar l'equipament. Habitualment, primer es deixa que els nens i nenes es
      provin les talles a l'entrenament amb l'equipament de mostra; un cop fet això, es pot sol·licitar
      la talla (i el dorsal, en funció de la disponibilitat). El delegat/da envia llavors una llista perquè
      cada família hi apunti la seva comanda. Un cop feta la comanda, l'equipament es recull a la caseta
      de material, a la planta 0, després de passar el camp 1. Els horaris de recollida els comunica el
      delegat/da de
  - evidence_id: qa-proces-inscripcions
    text: 'El procés varia una mica segons si es tracta d''una renovació o d''una alta nova: - Renovacions:
      es fan directament a través de Cluber seguint els passos explicats a la pregunta "Què he de fer
      per inscriure o renovar un jugador?". - Altes noves: normalment cal que el/la responsable de la
      secció doni el vistiplau al nou jugador/a (per exemple després d''un període de prova) abans de
      formalitzar l''inscripció. En el cas de menors d''edat, durant el procés els tutors legals han de
      signar electrònicament la documentació i la normativa del club; rebreu un correu de signatura per
      a cada tutor indicat al '
  - evidence_id: qa-preus-comanda-roba-thunder
    text: 'Preus orientatius (poden variar d''una temporada a una altra; confirma sempre el preu vigent):
      - Samarreta: 38,50€ - Pantaló curt / faldilla: 29,50€ - Mitges: 18,50€ - Dessuadora amb caputxa
      (Junior): 34,90€ - Pack equipació complet Adult: 125€ - Pack equipació complet Junior: 86,50€ -
      Impermeable: 27,90€ - Softshell: 59,90€ Les comandes es fan per correu a ropabhc1977@gmail.com.'
  - evidence_id: qa-revisio-medica-reserva
    text: No cal que ho gestionis tu directament ni que reservis hora enlloc. Quan es confirmen les dates
      de les revisions mèdiques a l'inici de curs, el delegat/da de la teva secció n'informa i recull
      els noms de qui les necessita per apuntar-vos a la llista.
  - evidence_id: qa-entrenaments-pluja
    text: Per norma general, si plou es manté l'entrenament. Si en algun moment les condicions fossin
      impracticables, el club avisaria com més aviat millor; mentre no rebeu cap comunicació en sentit
      contrari, doneu per fet que l'entrenament es manté. Si un cop a la instal·lació es posa a ploure
      durant la sessió, els entrenadors tenen recursos per fer activitats a cobert (jocs, xerrades, pissarra,
      etc.). És recomanable que els nens i nenes portin un impermeable, i roba de recanvi per canviar-se
      en acabar l'entrenament.
  - evidence_id: qa-revisions-mediques
    text: Cada temporada, a l'inici de curs (normalment al setembre), ve al Pau Negre la mateixa empresa
      que fa les revisions mèdiques any rere any, en unes dates concretes que s'anuncien abans de començar.
      Revisa el perfil del jugador/a a la Federació Catalana d'Hoquei per saber si el seu certificat mèdic
      ja ha caducat o li caduca aviat. Si necessita renovar-lo, el delegat/da de la teva secció recull
      els noms de qui ho necessita i s'encarrega de coordinar la cita amb l'empresa que fa les revisions.
