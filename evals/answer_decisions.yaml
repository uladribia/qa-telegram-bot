      categories) Els tècnics, preparadors físics, fisios i metges donen servei a totes dues branques
      per igual. A Minis, per tant, el club de referència és el BHC. Aquesta distribució pot variar d''una
      temporada a '
  - evidence_id: qa-hockey-sala-herba-combinat
    text: 'Sí, en algunes categories (a partir d''Aleví, aproximadament) hi pot haver una part de la temporada
      en què l''equip alterna hoquei sala i hoquei herba. Un esquema habitual és dividir el grup en dos:
      mentre un subgrup entrena hoquei sala en una instal·lació coberta, l''altre entrena hoquei herba
      al Pau Negre, i al cap d''uns dies s''intercanvien. Sovint hi ha algun dia de la setmana en què
      tot l''equip entrena junt en hoquei sala. El calendari exacte, els horaris i la instal·lació concreta
      els confirma l''entrenador/a de cada equip a l''inici de curs, així que consulta-ho amb l''entrenador/a
      o el delega'
  - evidence_id: qa-organitzacio-escola
    text: 'L''escola s''organitza per categories d''edat, de més petits a més grans: - Escoleta (dissabtes)
      - Minis - Prebenjamí - Benjamí - Aleví - Infantil - Cadet - Juvenil A Benjamí ja es pot fer equip
      masculí i equip femení separats si hi ha prou jugadors i jugadores; a partir d''Aleví, els grups
      ja se solen dividir sempre en equips masculins i femenins. En algunes categories, a més, hi conviuen
      equips diferenciats del Barcelona Hockey Club (BHC) i del FC Barcelona (FCB). Cada equip té el seu
      propi delegat/da i cos tècnic.'
