- question: "Demà plourà?"
  reason: not_in_knowledge
- question: "A quina hora acaba el partit del dia 3 de novembre?"
  reason: unconfirmed_future
- question: "Qui és l'entrenador de la temporada vinent?"
  reason: unconfirmed_future
- question: "On és la seu del club exactament?"
