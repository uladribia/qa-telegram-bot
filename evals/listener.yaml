# SPDX-License-Identifier: MIT
# Listener question-identification and temporal-pairing eval set.
# Cases are based on the structure and realistic wording of data/seed/whatsapp.jsonl.
# Synthetic cases are not seed knowledge and must not be inserted into production data.
#
# Message labels:
#   question       - a message that asks for information
#   answer_like    - a message that can answer a nearby question
#   chitchat       - social/noise message
#   knowledge_update - factual update that is not a question
#   correction     - correction of an earlier claim
# A pair is valid only when its two ids appear in expected_pairs.

- id: seed_equipment_question_answer
  source: whatsapp
  conversation_id: synthetic-equipment
  messages:
    - id: q-equipment
      source_message_id: 9fa4d562590a1098
      text: "Bon dia, tema equipació hem de comprar-la a algun lloc? O tan petits no porten?"
      expected_label: question
    - id: a-equipment
      source_message_id: 4269f303a2a0ebae
      text: "hola Marta, els minis tindran equipació. Suposo que durant aquest més rebrem instruccions"
      expected_label: answer_like
  expected_question_ids: [q-equipment]
  expected_answer_ids: [a-equipment]
  expected_pairs:
    - [q-equipment, a-equipment]
  synthetic: false

