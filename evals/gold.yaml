  provenance: Next season's price is not published.
  category: unknown_future
- id: gold_abstention_06
  question: Qui ha guanyat el partit d'ahir?
  expected_mode: abstention
  reason: not_in_knowledge
  provenance: Match results are not in the corpus.
  category: not_in_knowledge
- id: gold_abstention_07
  question: Pots dir-me el telèfon del delegat?
  expected_mode: abstention
  reason: personal_data
  # The first wording here was "Personal data is never published", which is
  # factually wrong: qa-contacte-club publishes the club's own phone and email.
  # What the corpus does NOT have is a per-delegate line, so handing over the
  # club's general number for a question about one named delegate is a
  # wrong-entity answer, not a leak. Whether the bot should instead answer with
  # the published club contact is an open product question, so the expectation
  # stays abstention and this case keeps failing until that is decided.
  provenance: >-
    The corpus publishes the club's general contact (qa-contacte-club) but no
    per-delegate number, so a bare number is a wrong-entity answer.
  category: personal_data
- id: gold_abstention_08
  question: Quin és el correu del president?
