# SPDX-License-Identifier: MIT
# Human gold, end to end: the one source of truth for the live answer and
# abstention gates. Every case was checked by a human against the real corpus.
#
# The rules this file keeps:
#   - unique id and a real user question per case;
#   - answerable cases state `expected_source` when the anchor is deterministic,
#     plus a small number of essential `must_include` facts. A missing required
#     fact FAILS the case: it is a hard gate, not a warning;
#   - `must_not_claim` is only for materially wrong claims, never style;
#   - abstention cases state the reason and the provenance, and never invent a
#     fake answer string;
#   - no case-count gate. Volume is not quality; synthetic experiments live in
#     answers_synthetic.yaml and abstention_synthetic.yaml;
#   - end-to-end gold is global, like a normal user question. A case that needs
#     group-local knowledge is not here.
#
# Repaired while consolidating: "On és la seu del club exactament?" was listed
# as answerable with no required fact AND as an abstention. The corpus documents
# no club-office address, so it is an abstention and now says why.

answers:
