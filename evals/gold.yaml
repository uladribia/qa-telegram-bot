abstentions:
- id: gold_abstention_01
  question: Quin és el dorsal del meu fill?
  expected_mode: abstention
  reason: personal
  provenance: A personal question the knowledge base cannot answer.
  category: personal_data
- id: gold_abstention_02
  question: Demà vindrà l'entrenador Marc?
  expected_mode: abstention
