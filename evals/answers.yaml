# SPDX-License-Identifier: MIT
# Factual-answer eval set (spec §39). Deterministic checks: the answer must
# contain `must_include` and must not contain `must_not_claim`.
# `expected_mode` uses the runtime modes: every answered question is a
# `synthesis` (the verbatim-echo `direct_qa` mode was removed when answering
# became always grounded), and a question the model declines is `abstention`.

- id: equipment_order
