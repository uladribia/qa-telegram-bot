[project]
name = "knowledge-bot"
version = "0.1.0"
description = "Channel-agnostic knowledge bot backend."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Ula" }]
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
kb = "knowledge_bot.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pre-commit>=4.0,<5",
  "pytest>=8.4.1,<10",
  "pytest-asyncio>=1.4.0",
  "ruff==0.15.0",
  "ty==0.0.67",
  "typer>=0.27.2",
  "workers-py>=1.17.3",
  "workers-runtime-sdk>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<1.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.0,<1.0"
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "knowledge_bot"
module-root = "src"

[tool.ruff]
target-version = "py313"
include = [
  "pyproject.toml",
  "src/**/*.py",
  "tests/**/*.py",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "C",    # convention
  "B",    # flake8-bugbear
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "RUF",  # ruff
  "PTH",  # pathlib
  "SIM",  # simplify
  "RET",  # return
  "RSE",  # raise
  "Q",    # quotes
  "G",    # logging-format
  "LOG",  # logging
  "ISC",  # implicit str concat
  "C4",   # comprehensions
  "COM",  # commas
  "TD",   # to-do
  "INT",  # gettext
  "TRY",  # tryceratops
  "ANN",  # annotations
]
ignore = [
  "C901",    # too complex
  "B023",    # function definition does not bind loop variable
  "N805",    # allow naming `self` to first class argument
  "RUF012",  # mutable class attribute
  "RUF013",  # implicit optional
  "ISC001",  # allow implicit str concat
  "COM812",  # allow missing trailing comma
]

[tool.ruff.lint.per-file-ignores]
"src/knowledge_bot/cli.py" = ["B008"]
# The Vectorize binding method mirrors the JS API name.
"src/knowledge_bot/infrastructure/cloudflare/vectorize.py" = ["N802"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = [
  "src",
  "tests",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: fast tests with no external dependencies",
  "architecture: import-boundary checks (fast)",
  "integration: in-process flows with in-memory fakes",
  "smoke: Worker/Docker runtime checks (slow, milestone boundaries)",
]
