name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: uv sync --frozen
      - run: make lint
      - run: make test
      - run: make test-integration
      - run: uv run python -m evals.run offline
